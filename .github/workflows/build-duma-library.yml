name: Build DUMA Online Library APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'duma-library-android/**'
      - '.github/workflows/build-duma-library.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle -p duma-library-android assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DUMA-Online-Library-APK
          path: duma-library-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
